version: '3.8'

services:
  app:
    build: .
    container_name: wa-gateway-api
    ports:
      - "3333:3333" # Diubah ke 3333 untuk menghindari bentrok dengan React (3000/5173) atau Golang (8080)
    volumes:
      - ./src:/usr/src/app/src
      - ./sessions:/usr/src/app/sessions
      - ./logs:/usr/src/app/logs
    environment:
      - NODE_ENV=production
      - PORT=3333
    shm_size: '1gb' # SANGAT PENTING: Mencegah Chromium crash (Aw, Snap!) karena limit default /dev/shm 64MB di Docker
    restart: always # Penting untuk auto-recovery bot
    # networks:
    #   - shared-network # Gunakan jika ingin diakses dari container Nginx di network yang sama

# networks:
#   shared-network:
#     external: true
