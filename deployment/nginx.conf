server {
    listen 80;
    server_name wa.yourdomain.com; # Wajib gunakan subdomain spesifik agar tidak bentrok dengan React/Golang

    location / {
        proxy_pass http://localhost:3333; # Port disesuaikan dengan wa-gateway-api
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Cloudflare & Real IP Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip; # Spesifik untuk membaca IP asli dari Cloudflare
        
        proxy_cache_bypass $http_upgrade;
        
        # Penyesuaian Timeout untuk WebSocket dan Webhooks yang berat
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }
}
