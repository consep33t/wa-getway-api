name: Production Auto Deployment

on:
  push:
    branches: [ "production" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Notify Discord (Start)
      run: |
        curl -H "Content-Type: application/json" -d '{"content": "⏳ **Deployment Started** to Production (`alfa@alfanet`)..."}' ${{ secrets.DISCORD_WEBHOOK_URL }}

    - name: Executing Remote SSH Commands for Deployment
      uses: appleboy/ssh-action@v1.0.3
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || '22' }}
        envs: DISCORD_WEBHOOK_URL
        script: |
          set -e
          
          cd ~/wa-gateway-api
          
          git fetch origin
          git reset --hard origin/production
          
          docker compose build > build.log 2>&1
          docker compose down
          docker compose up -d
          
          LOG_SNIPPET=$(tail -n 15 build.log)
          PAYLOAD=$(jq -n --arg content "✅ **Deployment Berhasil ke Production (alfa@alfanet)**
          \`\`\`text
          $LOG_SNIPPET
          \`\`\`" '{content: $content}')
          curl -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

    - name: Notify Discord (Error)
      if: failure()
      run: |
        curl -H "Content-Type: application/json" -d '{"content": "❌ **Deployment Failed!** Terdapat error saat deployment ke `alfa@alfanet`. Silakan cek log di GitHub Actions."}' ${{ secrets.DISCORD_WEBHOOK_URL }}
