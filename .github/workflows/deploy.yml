name: Production Auto Deployment

on:
  push:
    branches: [ "production" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Set environment variables
      id: vars
      run: |
        echo "SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV
        echo "START_TIME=$(TZ='Asia/Jakarta' date +'%H:%M WIB %d/%m/%Y')" >> $GITHUB_ENV
        echo "START_TS=$(date +%s)" >> $GITHUB_ENV
        
        # Ambil hanya baris pertama (judul) dari commit message
        COMMIT_TITLE=$(jq -r '.head_commit.message | split("\n")[0]' "$GITHUB_EVENT_PATH")
        echo "COMMIT_TITLE=$COMMIT_TITLE" >> $GITHUB_ENV

    - name: Notify Discord (Start)
      run: |
        jq -n \
          --arg title "🚀 Backend Auto-Deploy Started!" \
          --arg status "🏗️ Building and recreating container..." \
          --arg time "$START_TIME" \
          --arg container "wa-gateway-api" \
          --arg branch "production" \
          --arg msg "$COMMIT_TITLE" \
          --arg sha "$SHORT_SHA" \
          --arg actor "${{ github.actor }}" \
          '{
            embeds: [{
              title: $title,
              description: ("Status: " + $status + "\nTime: " + $time),
              color: 16753920,
              fields: [
                { name: "Container", value: $container, inline: true },
                { name: "Branch", value: $branch, inline: true },
                { name: "Commit", value: ($msg + " (" + $sha + ") by " + $actor), inline: false }
              ]
            }]
          }' > payload.json
        curl -H "Content-Type: application/json" -d @payload.json ${{ secrets.DISCORD_WEBHOOK_URL }}

    - name: Connect to Tailscale
      uses: tailscale/github-action@v2
      with:
        authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
        
    - name: Executing Remote SSH Commands for Deployment
      id: ssh-deploy
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || '22' }}
        script: |
          set -e
          cd /home/${{ secrets.SERVER_USERNAME }}/wa-gateway-api
          git fetch origin
          git reset --hard origin/production
          docker compose build
          docker compose down
          docker compose up -d

    - name: Notify Discord (Success)
      if: success()
      run: |
        END_TIME=$(TZ='Asia/Jakarta' date +'%H:%M WIB %d/%m/%Y')
        END_TS=$(date +%s)
        DURATION=$((END_TS - START_TS))
        
        jq -n \
          --arg title "✅ Backend Auto-Deploy Successful!" \
          --arg status "✨ Service is now running perfectly!" \
          --arg time "$END_TIME" \
          --arg dur "${DURATION}s" \
          --arg container "wa-gateway-api" \
          --arg branch "production" \
          --arg msg "$COMMIT_TITLE" \
          --arg sha "$SHORT_SHA" \
          --arg actor "${{ github.actor }}" \
          '{
            embeds: [{
              title: $title,
              description: ("Status: " + $status + "\nFinished: " + $time + "\nDuration: " + $dur),
              color: 65280,
              fields: [
                { name: "Container", value: $container, inline: true },
                { name: "Branch", value: $branch, inline: true },
                { name: "Commit", value: ($msg + " (" + $sha + ") by " + $actor), inline: false }
              ]
            }]
          }' > payload.json
        curl -H "Content-Type: application/json" -d @payload.json ${{ secrets.DISCORD_WEBHOOK_URL }}

    - name: Notify Discord (Error)
      if: failure()
      run: |
        END_TIME=$(TZ='Asia/Jakarta' date +'%H:%M WIB %d/%m/%Y')
        END_TS=$(date +%s)
        DURATION=$((END_TS - START_TS))
        
        jq -n \
          --arg title "❌ Backend Auto-Deploy Failed!" \
          --arg status "⚠️ Terdapat error saat deployment ke server." \
          --arg time "$END_TIME" \
          --arg dur "${DURATION}s" \
          --arg container "wa-gateway-api" \
          --arg branch "production" \
          --arg msg "$COMMIT_TITLE" \
          --arg sha "$SHORT_SHA" \
          --arg actor "${{ github.actor }}" \
          '{
            embeds: [{
              title: $title,
              description: ("Status: " + $status + "\nFinished: " + $time + "\nDuration: " + $dur),
              color: 16711680,
              fields: [
                { name: "Container", value: $container, inline: true },
                { name: "Branch", value: $branch, inline: true },
                { name: "Commit", value: ($msg + " (" + $sha + ") by " + $actor), inline: false }
              ]
            }]
          }' > payload.json
        curl -H "Content-Type: application/json" -d @payload.json ${{ secrets.DISCORD_WEBHOOK_URL }}
